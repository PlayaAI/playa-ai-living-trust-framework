name: Validate toolkit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Validate control catalog and documentation
        run: ruby scripts/validate.rb

      - name: Reject whitespace errors
        run: git diff --check HEAD^ -- . ':(exclude)research/synthesis-public-draft.md'
